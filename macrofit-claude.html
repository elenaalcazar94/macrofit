<style>
/* Layout: app móvil de una columna, tarjetas oscuras con acento lima y barra de navegación flotante (diseño de la app MacroFit, solo tema oscuro) */
:root{color-scheme:dark;
  --bg:#0b0c0a;--c1:#1a1c18;--c2:#23261f;--line:#2e3229;--tx:#f2f4ee;--mu:#8b9083;
  --lime:#d6f74a;--dk:#0b0c0a;--p:#d6f74a;--c:#9ad8ff;--f:#ffb86b;--warn:#ff8a6b;--ok:#7ee08a;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--r:28px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:500 15px/1.45 var(--font);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
body::after{content:"";position:fixed;left:-30%;top:-10%;width:160%;height:55%;background:radial-gradient(closest-side,#d6f74a24,transparent);pointer-events:none;z-index:-1}
main{max-width:520px;margin:0 auto;padding-block:16px 0}
h1{font-size:30px;line-height:1.1;margin:10px 0 4px;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
h2{font-size:18px;margin:22px 0 10px;font-weight:700}
h2.sp{display:flex;justify-content:space-between;align-items:baseline}
.mu{color:var(--mu);font-size:13px}.small{font-size:12.5px}
.eyebrow{color:var(--lime);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:24px 0 0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--c2);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx);font-size:20px;flex:none}
.ib:disabled{opacity:.3}
.card{background:linear-gradient(160deg,#20231d,#141612);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0}
.lime{background:var(--lime);color:var(--dk);border-color:var(--lime)}.lime .mu{color:#3d4a12}
.danger{border-color:#4a2a22}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid3.nogap{gap:14px}
.tile{text-align:center;margin:0;padding:14px}.tile b{font-size:22px;display:block}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.ring{position:relative;width:230px;height:230px;margin:10px auto}.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.bar{height:8px;background:var(--c2);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:20px;border:none;font:700 16px var(--font);background:var(--lime);color:var(--dk);cursor:pointer}
.btn.g{background:var(--c2);color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:12px;font-size:15px}
.btn:disabled{opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:8px}
label.check{display:flex;align-items:center;gap:10px;color:var(--tx);margin:0 0 6px}label.check input{width:20px;height:20px;margin:0;accent-color:var(--lime)}
input,textarea,select{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--c1);color:var(--tx);font:500 16px var(--font);margin:6px 0}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{flex:none;padding:10px 16px;border-radius:99px;background:var(--c2);border:1px solid var(--line);color:var(--tx);font:600 14px var(--font);cursor:pointer}
.chip.on{background:var(--lime);color:var(--dk);border-color:var(--lime)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--c2);color:var(--mu)}.pill.ok{background:#1f3b23;color:var(--ok)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:22px;background:var(--c1);border:1px solid var(--line);margin:8px 0;color:var(--tx);font:inherit;cursor:pointer}
.row.static{cursor:default;margin:12px 0}
.row .ic{width:44px;height:44px;border-radius:14px;background:var(--c2);display:grid;place-items:center;flex:none;font-size:18px;color:var(--lime)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t .mu{display:block}
.row .k{font-weight:800;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--c2);color:var(--mu);font-weight:700}
.tag.M{background:#1f3b23;color:var(--ok)}.tag.L{background:#1d2c48;color:#8cb6ff}
.snap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:14px 0 4px;padding:16px;border-radius:24px;border:1px dashed #5b6b1f;background:#d6f74a10;color:var(--tx);font:inherit;cursor:pointer}
.snap .ic{width:52px;height:52px;border-radius:18px;background:var(--lime);color:var(--dk);display:grid;place-items:center;flex:none}
.snap b{display:block;font-size:16px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:8px;background:#1a1c18ee;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;z-index:5}
nav button{width:62px;height:56px;border-radius:20px;border:none;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px var(--font);cursor:pointer}
nav button.on{background:var(--lime);color:var(--dk)}nav button.cam{background:var(--tx);color:var(--dk)}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;z-index:10}
.sheet>div{width:100%;max-width:520px;margin:0 auto;background:#141612;border-radius:32px 32px 0 0;border:1px solid var(--line);border-bottom:none;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:92%;overflow:auto}
.ph{width:100%;border-radius:24px;max-height:300px;object-fit:cover;display:block}
.mac{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mu)}.mac b{color:var(--tx)}.lime .mac,.lime .mac b{color:var(--dk)}
.dot{display:inline-block;width:8px;height:8px;border-radius:9px;margin-right:4px}
.spin{width:22px;height:22px;border:3px solid #0003;border-top-color:var(--dk);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.week{display:flex;align-items:flex-end;gap:8px;height:110px}.week div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.week i{display:block;border-radius:10px;background:var(--c2);margin-bottom:6px}
.empty{text-align:center;color:var(--mu);padding:16px}
.item{padding:14px}.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.g5 input{padding:10px 4px;text-align:center}.g5 label{text-align:center;margin:0}
.rt{font-size:17px;min-width:0}
details{margin:0 0 12px}summary{font-weight:700;cursor:pointer}details p{margin:8px 0 0;line-height:1.5}
.splash{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:24px}.splash .spin{border-color:#ffffff22;border-top-color:var(--lime)}
.logo{width:72px;height:72px}.logo svg{width:100%;height:100%;display:block}.logo.sm{width:44px;height:44px}
.ob{display:flex;flex-direction:column;min-height:calc(100vh - 60px)}.ob h1{margin-top:20px}.ob>.btn{margin-top:auto;position:sticky;bottom:16px}
.prog{height:6px;background:var(--c2);border-radius:9px;margin-top:16px;overflow:hidden}.prog i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .4s}
.opts{display:flex;flex-direction:column;gap:10px;margin:16px 0 24px}
.opt{text-align:left;padding:18px 20px;border-radius:22px;background:var(--c1);border:1.5px solid var(--line);color:var(--tx);font:600 16px var(--font);cursor:pointer}
.opt span{display:block;color:var(--mu);font-size:13px;font-weight:500;margin-top:4px}.opt.on{border-color:var(--lime);background:#d6f74a14}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--tx);color:var(--dk);padding:12px 18px;border-radius:16px;font:700 14px var(--font);z-index:20;transition:transform .3s;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const cloud=()=>!!(db&&uid);
async function load(k){

}

/* ---------- Onboarding ---------- */
function onboarding(){
  ob??={step:0,name:S.name||"",s:"m",a:30,h:165,w:65,act:1.375,goal:"d"};
  const o=ob,N=6,opt=(v,cur,t,d)=>`<button class="opt ${cur==v?"on":""}" data-v="${v}"><b>${t}</b>${d?`<span>${d}</span>`:""}</button>`;
  const steps=[
    ["¿Cómo te llamas?","Así personalizamos tu experiencia.",`<label for="ov">Nombre</label><input id="ov" value="${esc(o.name)}" placeholder="Tu nombre" autocomplete="given-name">`],
    ["¿Cuál es tu sexo?","Lo necesitamos para calcular tu metabolismo basal.",`<div class="opts">${opt("m",o.s,"Mujer")}${opt("h",o.s,"Hombre")}</div>`],
    ["Cuéntanos sobre ti","Edad, altura y peso actual.",`<label for="oa">Edad</label><input id="oa" type="number" inputmode="numeric" value="${o.a}"><label for="oh">Altura (cm)</label><input id="oh" type="number" inputmode="numeric" value="${o.h}"><label for="ow">Peso (kg)</label><input id="ow" type="number" inputmode="decimal" step="0.1" value="${o.w}">`],
    ["¿Cuánto te mueves?","Incluye trabajo y entrenamiento.",`<div class="opts">${ACT.map(([v,t,d])=>opt(v,o.act,t,d)).join("")}</div>`],
    ["¿Cuál es tu objetivo?","Ajustaremos calorías y proteína.",`<div class="opts">${Object.entries(GOALS).map(([v,t])=>opt(v,o.goal,t,GOAL_DESC[v])).join("")}</div>`],
  ];
  const head=`<div class="top">${o.step?`<button class="ib" id="bk" aria-label="Atrás">‹</button>`:`<span class="logo sm">${ICON}</span>`}<span class="mu">${o.step+1} / ${N}</span><span style="width:44px"></span></div><div class="prog"><i style="width:${(o.step+1)/N*100}%"></i></div>`;
  if(o.step<5){
    const [t,d,body]=steps[o.step];
    app.innerHTML=`<div class="ob">${head}${o.step===0?`<p class="eyebrow">Bienvenida a MacroFit</p>`:""}<h1>${t}</h1><p class="mu">${d}</p>${body}<button class="btn" id="nx">Continuar</button></div>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b)));
  }else{
    const t=targets({s:o.s,a:o.a,h:o.h,w:o.w,act:o.act,goal:o.goal});
    app.innerHTML=`<div class="ob">${head}<h1>${o.name?esc(o.name)+", este":"Este"} es<br>tu plan</h1><p class="mu">Objetivo: ${GOALS[o.goal].toLowerCase()}. Puedes cambiarlo cuando quieras en Perfil.</p>
    <div class="card lime" style="text-align:center"><div class="mu">Calorías diarias</div><div class="big" style="font-size:56px">${t.k}</div><div class="mu">kcal</div></div>
    <div class="grid3">${[["Proteína",t.p,"var(--p)"],["Carbos",t.c,"var(--c)"],["Grasa",t.f,"var(--f)"]].map(([n,v,c])=>`<div class="card tile"><i class="dot" style="background:${c}"></i><div class="mu">${n}</div><b>${v} g</b></div>`).join("")}</div>
    <p class="mu small">${cloud()?"Tus datos se guardan de forma privada en tu cuenta de Claude.":"Sin sesión de Claude, tus datos se guardarán solo en este navegador."}</p>
    <button class="btn" id="nx">Empezar</button></div>`;
  }
  $("#bk")&&($("#bk").onclick=()=>{o.step--;onboarding()});
  $("#nx").onclick=()=>{
    const sel=app.querySelector(".opt.on")?.dataset.v;
    if(o.step===0){o.name=$("#ov").value.trim();if(!o.name)return toast("Escribe tu nombre")}
    if(o.step===1)o.s=sel;
    if(o.step===2){o.a=+$("#oa").value;o.h=+$("#oh").value;o.w=+$("#ow").value;if(!(o.a>10&&o.h>100&&o.w>25))return toast("Revisa edad, altura y peso")}
    if(o.step===3)o.act=+sel;
    if(o.step===4)o.goal=sel;
    if(o.step<5){o.step++;scrollTo(0,0);return onboarding()}
    S.name=o.name;S.profile={s:o.s,a:o.a,h:o.h,w:o.w,act:o.act,goal:o.goal};saveProfile();ob=null;nav("hoy");
  };
}

/* ---------- Hoy ---------- */
function hoy(){
  if(weekOf(day).some(x=>!log[x])){app.innerHTML=SPLASH;ensureWeek(day).then(()=>view==="hoy"&&render());return}
  const t=targets(),s=tot(day),left=t.k-s.k,pc=Math.min(1,s.k/t.k),R=100,L=2*Math.PI*R,d=pd(day),isT=day===today();
  const mb=(n,v,g,col)=>`<div><div class="mac"><span><i class="dot" style="background:${col}"></i>${n}</span></div><b class="num">${r0(v)}</b><span class="mu"> / ${g} g</span><div class="bar"><i style="width:${Math.min(100,v/g*100)}%;background:${col}"></i></div></div>`;
  const wk=weekOf(day).map(k=>{const v=tot(k).k;return`<div><i style="height:${Math.max(6,Math.min(90,v/t.k*80))}px;${k===day?"background:var(--lime)":v>t.k*1.05?"background:var(--warn)":""}"></i>${"DLMXJVS"[pd(k).getDay()]}</div>`}).join("");
  app.innerHTML=`<div class="top"><button class="ib" id="pv" aria-label="Día anterior">‹</button><div style="text-align:center"><b>${isT?"Hoy":d.toLocaleDateString("es",{weekday:"long"})}</b><div class="mu">${d.toLocaleDateString("es",{day:"numeric",month:"long"})}</div></div><button class="ib" id="nx" aria-label="Día siguiente" ${isT?"disabled":""}>›</button></div>
  <h1>Hola${S.name?", "+esc(S.name):""}</h1><p class="mu">Objetivo: ${GOALS[S.profile.goal].toLowerCase()}</p>
  <div class="ring"><svg width="230" height="230" viewBox="0 0 230 230"><circle cx="115" cy="115" r="${R}" stroke="var(--c2)" stroke-width="18" fill="none"/><circle cx="115" cy="115" r="${R}" stroke="${left<0?"var(--warn)":"var(--lime)"}" stroke-width="18" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-pc)}"/></svg>
  <div class="in"><div class="big num">${Math.abs(r0(left))}</div><div class="mu">${left<0?"kcal de más":"kcal restantes"}</div><div class="mu num" style="margin-top:6px">${r0(s.k)} / ${t.k}</div></div></div>
  <div class="card grid3 nogap">${mb("Prot",s.p,t.p,"var(--p)")}${mb("Carbos",s.c,t.c,"var(--c)")}${mb("Grasa",s.f,t.f,"var(--f)")}</div>
  <button class="snap" id="snap"><span class="ic">${CAM}</span><span><b>Haz una foto a tu plato</b><span class="mu">Claude calcula calorías y macros</span></span></button>
  ${MEALS.map(m=>{const es=(log[day]||[]).filter(e=>e.meal===m),k=es.reduce((a,e)=>a+e.k,0);
    return`<h2 class="sp">${m}<span class="mu num">${r0(k)} kcal</span></h2>${es.map(e=>`<button class="row" data-id="${e.id}"><div class="ic">${e.ai?"✦":"●"}</div><div class="t"><b>${esc(e.n)}</b><span class="mu">${e.g?r0(e.g)+" g · ":""}P ${r1(e.p)} · C ${r1(e.c)} · G ${r1(e.f)}</span></div><div class="k num">${r0(e.k)}</div></button>`).join("")||`<button class="row add" data-m="${m}"><div class="ic">+</div><span class="mu">Añadir</span></button>`}`}).join("")}
  <h2>Últimos 7 días</h2><div class="card"><div class="week">${wk}</div></div>`;
  const mv=n=>{const x=shift(day,n);if(x<=today()){day=x;render()}};
  $("#pv").onclick=()=>mv(-1);$("#nx").onclick=()=>mv(1);$("#snap").onclick=photo;
  app.querySelectorAll(".row[data-id]").forEach(r=>r.onclick=()=>editEntry(r.dataset.id));
  app.querySelectorAll(".add").forEach(b=>b.onclick=()=>{lastMeal=b.dataset.m;nav("buscar")});
}
function editEntry(id){

  open(`<h2>${esc(e.n)}</h2>${per?`<label for="eg">Gramos</label><input id="eg" type="number" value="${r0(e.g)}">`:""}<label for="ms">Comida</label>${mealSel(e.meal)}

/* ---------- Claude: foto y texto ---------- */
const AI_ERR={not_granted:"Para analizar, permite que esta página use Claude.",rate_limited:"Has hecho muchas consultas seguidas. Espera un momento.",images_unavailable:"Esta vista no puede enviar fotos a Claude. Prueba a describir el plato con texto.",image_rejected:"Ese formato de imagen no se admite. Usa una foto JPG o PNG.",invalid_json:"Claude no devolvió un resultado legible. Inténtalo otra vez.",refused:"Claude no ha podido analizar esta imagen."};
const aiErr=e=>AI_ERR[e?.code]||"Claude no está disponible ahora mismo. Inténtalo en un rato.";
const FORMAT=`Responde SOLO con JSON: {"items":[{"n":"nombre en español","g":gramos,"k":kcal,"p":proteína_g,"c":carbohidratos_g,"f":grasa_g}],"nota":"comentario breve en español"}. Los valores son los TOTALES de esa cantidad, no por 100 g. Ejemplo: {"items":[{"n":"Arroz blanco cocido","g":150,"k":195,"p":4,"c":42,"f":0.5}],"nota":"Arroz sin aceite visible"}`;
function photo(){
  if(!sample)return open(`<h2>Análisis con Claude</h2><p class="mu">Abre MacroFit desde Claude e inicia sesión para analizar tus platos.</p><button class="btn g" id="mn2">Añadir a mano</button>`),$("#mn2").onclick=()=>{close();nav("buscar")};
  if(!imgLimits)return open(`<h2>Foto no disponible</h2><p class="mu">En esta vista no se pueden enviar fotos a Claude, pero puedes describir lo que has comido.</p><button class="btn" id="dsc">✦ Describir con texto</button>`),$("#dsc").onclick=()=>describe("");
  const inp=$("#cam");inp.accept=imgLimits.mediaTypes.join(",");inp.click();
}
$("#cam").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  let blob=file,url;
  try{const bmp=await createImageBitmap(file),sc=Math.min(1,1280/Math.max(bmp.width,bmp.height)),cv=document.createElement("canvas");
    cv.width=bmp.width*sc;cv.height=bmp.height*sc;cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));url=URL.createObjectURL(blob)}catch{url=URL.createObjectURL(file)}
  open(`<img class="ph" src="${url}" alt="Foto del plato"><h2>Analizar plato</h2><label for="info">Información extra (opcional)</label><textarea id="info" placeholder="Ej. arroz unos 150 g cocido, con una cucharada de aceite, salsa sin azúcar"></textarea>
  <label for="ms">Comida</label>${mealSel()}<button class="btn" id="an" style="margin-top:10px">✦ Analizar con Claude</button><div id="ar"></div>`);
  $("#an").onclick=()=>analyze(`Eres un nutricionista experto. Identifica cada alimento del plato de la imagen adjunta, estima su peso en gramos y calcula kcal, proteína, carbohidratos y grasa. Ten en cuenta aceites y salsas visibles. Usa productos españoles típicos (Mercadona, Lidl) como referencia.${$("#info").value.trim()?`\nInformación del usuario (prioritaria sobre lo que veas): ${$("#info").value.trim()}`:""}\n${FORMAT}`,{images:[blob]});
};
function describe(text){
  open(`<h2>Describir con Claude</h2><p class="mu">Escribe lo que has comido con cantidades aproximadas.</p><label for="info">Qué has comido</label><textarea id="info" placeholder="Ej. un bol de lentejas con chorizo y un trozo de pan">${esc(text)}</textarea>
  <label for="ms">Comida</label>${mealSel()}<button class="btn" id="an" style="margin-top:10px">✦ Calcular con Claude</button><div id="ar"></div>`);
  $("#an").onclick=()=>{const t=$("#info").value.trim();if(!t)return toast("Describe lo que has comido");
    analyze(`Eres un nutricionista experto. El usuario describe lo que ha comido: "${t}". Separa cada alimento, estima los gramos de una ración española normal si no los indica, y calcula kcal, proteína, carbohidratos y grasa. Usa productos españoles típicos (Mercadona, Lidl) como referencia.\n${FORMAT}`)};
}
async function analyze(prompt,opts={}){
  if(!sample)return toast("Claude no está disponible en esta vista");
  const b=$("#an");b.disabled=true;b.innerHTML=`<div class="spin"></div>Claude está analizando…`;
  $("#ar").innerHTML=`<button class="btn g" id="stop" style="margin-top:8px">Detener</button>`;
  ctl=new AbortController();$("#stop").onclick=()=>ctl.abort();
  try{
    const d=await sample.json(prompt,{...opts,signal:ctl.signal});
    const items=(Array.isArray(d?.items)?d.items:[]).filter(x=>x&&x.n).map(x=>({n:String(x.n),g:+x.g||0,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0}));
    if(!items.length)throw{code:"empty"};
    showAI(items,d.nota);
  }catch(e){
    if(!$("#an"))return;
    b.disabled=false;b.textContent="✦ Reintentar";
    $("#ar").innerHTML=e?.code==="cancelled"?"":`<p class="empty">${esc(e?.code==="empty"?"Claude no encontró alimentos. Añade más detalle e inténtalo otra vez.":aiErr(e))}</p>`;
  }
}
function showAI(it,nota){
  $("#an").remove();
  $("#ar").innerHTML=`${nota?`<p class="mu">${esc(nota)}</p>`:""}<p class="mu small">Revisa y corrige los valores antes de añadirlos.</p>${it.map((x,i)=>`<div class="card item"><label for="n${i}" class="sr">Alimento</label><input id="n${i}" data-i="${i}" data-k="n" value="${esc(x.n)}">
  <div class="g5">${["g","k","p","c","f"].map(k=>`<div><label for="${k}${i}">${{g:"g",k:"kcal",p:"P",c:"C",f:"G"}[k]}</label><input id="${k}${i}" type="number" data-i="${i}" data-k="${k}" value="${r0(x[k])}"></div>`).join("")}</div></div>`).join("")}
  <div class="card lime"><div class="big num" id="tk"></div><div class="mac" id="tm"></div></div><button class="btn" id="ok">Añadir todo</button>`;
  const tt=()=>{const s=it.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});$("#tk").textContent=r0(s.k)+" kcal";$("#tm").innerHTML=`<span>P <b>${r0(s.p)}</b></span><span>C <b>${r0(s.c)}</b></span><span>G <b>${r0(s.f)}</b></span>`};
  $("#ar").querySelectorAll("input[data-k]").forEach(inp=>inp.oninput=()=>{const i=inp.dataset.i,x=it[i],k=inp.dataset.k,v=inp.value;
    if(k==="g"&&x.g>0){const f=+v/x.g;["k","p","c","f"].forEach(m=>{x[m]*=f;$(`#${m}${i}`).value=r0(x[m])})}
    x[k]=k==="n"?v:+v;tt()});
  tt();
  $("#ok").onclick=()=>{lastMeal=$("#ms").value;addEntries(it.map(x=>({...x,ai:1})));lastMeal=null;close();nav("hoy")};
}

/* ---------- Recetas ---------- */
function ideas(){
  ideaG??=S.profile.goal;const t=targets(ideaG===S.profile.goal?S.profile:{...S.profile,goal:ideaG,manual:0}),L=IDEAS.filter(x=>x.o===ideaG&&x.t===ideaT);
  app.innerHTML=`<h1>Recetas</h1><p class="mu">Objetivo: ${t.k} kcal · ${t.p} g de proteína al día</p>
  <div class="chips" id="ig">${Object.entries(GOALS).map(([v,n])=>`<button class="chip ${ideaG===v?"on":""}" data-v="${v}">${n}</button>`).join("")}</div>
  <div class="chips" id="it">${[["comida","Comidas"],["cena","Cenas"]].map(([v,n])=>`<button class="chip ${ideaT===v?"on":""}" data-v="${v}">${n}</button>`).join("")}</div>
  ${L.map((x,i)=>`<div class="card ${i===0?"lime":""}"><div class="top"><b class="rt">${esc(x.n)}</b><span class="big num" style="font-size:24px">${x.k}</span></div>
  <div class="mac" style="margin:6px 0 10px"><span>P <b>${x.p}</b></span><span>C <b>${x.c}</b></span><span>G <b>${x.f}</b></span><span>kcal</span></div>
  <p class="mu" style="margin:0 0 8px">${esc(x.i)}</p><details><summary>Ver preparación</summary><p>${esc(x.s)}</p></details><button class="btn ${i===0?"":"g"} sm" data-i="${i}">＋ Añadir a ${ideaT==="comida"?"Comida":"Cena"}</button></div>`).join("")}`;
  $("#ig").onclick=e=>{const b=e.target.closest(".chip");if(b){ideaG=b.dataset.v;ideas()}};
  $("#it").onclick=e=>{const b=e.target.closest(".chip");if(b){ideaT=b.dataset.v;ideas()}};
  app.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const x=L[b.dataset.i];lastMeal=ideaT==="comida"?"Comida":"Cena";addEntry({n:x.n,k:x.k,p:x.p,c:x.c,f:x.f});lastMeal=null;nav("hoy")});
}

/* ---------- Arranque ---------- */
(async()=>{
  render();
  const [d,u,s]=await Promise.all([use("db"),use("user"),use("sample")]);
  sample=s;
  if(s)imgLimits=(await s.limits().catch(()=>null))?.images||null;
  if(d&&u){uid=await Promise.resolve(u.id()).catch(()=>null);if(uid)db=d}
  const prof=await load("profile");
  if(prof)S={name:prof.name||"",profile:prof.profile||null,custom:prof.custom||[]};
  ready=true;render();
})();
</script>
